name: Build macOS
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S AmpLab -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Package
        run: |
          APP="$(find build -name 'Amp Lab.app' -type d | head -n 1)"
          codesign --force --deep -s - "$APP"
          ditto -c -k --keepParent "$APP" AmpLab-macOS.zip
      - uses: actions/upload-artifact@v4
        with:
          name: AmpLab-macOS
          path: AmpLab-macOS.zip
